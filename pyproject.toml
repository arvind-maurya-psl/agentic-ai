[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai"
version = "1.0.0"
description = "Production-grade Agentic AI application using AWS Bedrock and Microsoft Semantic Kernel"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Enterprise AI Team", email = "ai-team@example.com"}
]
keywords = [
    "ai",
    "agents",
    "bedrock",
    "semantic-kernel",
    "multi-agent",
    "orchestration",
    "aws"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.2.1",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "semantic-kernel>=1.0.0",
    "python-json-logger>=2.0.7",
    "typing-extensions>=4.9.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.1",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.8",
    "black>=23.12.0",
    "isort>=5.13.2",
    "flake8>=6.1.0",
    "mypy>=1.7.1",
    "bandit>=1.7.5",
    "safety>=2.3.5",
]

api = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
]

cache = [
    "redis>=5.0.1",
    "hiredis>=2.2.3",
]

database = [
    "sqlalchemy>=2.0.23",
    "psycopg2-binary>=2.9.9",
]

monitoring = [
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
]

[project.urls]
Homepage = "https://github.com/enterprise-ai/agentic-ai"
Documentation = "https://github.com/enterprise-ai/agentic-ai/wiki"
Repository = "https://github.com/enterprise-ai/agentic-ai.git"
"Bug Tracker" = "https://github.com/enterprise-ai/agentic-ai/issues"

[tool.setuptools]
packages = ["agentic_ai"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
agentic_ai = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["src/agentic_ai"]
omit = ["*/tests/*", "*/venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["agentic_ai"]
known_third_party = ["boto3", "semantic_kernel", "pydantic"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
    "W605",  # invalid escape sequence (will check)
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "semantic_kernel.*",
]
ignore_missing_imports = true
