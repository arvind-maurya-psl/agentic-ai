name: Deploy to AWS

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GitHubActionsDeployment
      
      - name: Set environment variables
        run: |
          if [ "${{ github.event.inputs.environment }}" == "production" ]; then
            echo "ENVIRONMENT=production" >> $GITHUB_ENV
            echo "AWS_REGION=${{ secrets.AWS_REGION_PROD }}" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=staging" >> $GITHUB_ENV
            echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV
          fi
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install awscli boto3
          pip install -r requirements.txt
      
      - name: Create deployment package
        run: |
          mkdir -p deployment
          cp -r src/ deployment/
          cp -r infrastructure/ deployment/
          cp requirements.txt deployment/
          cd deployment && zip -r ../agentic-ai-deployment.zip . && cd ..
      
      - name: Upload to S3
        run: |
          aws s3 cp agentic-ai-deployment.zip s3://${{ secrets.DEPLOYMENT_BUCKET }}/agentic-ai-${{ github.sha }}.zip
      
      - name: Update Lambda function (if applicable)
        run: |
          aws lambda update-function-code \
            --function-name agentic-ai-function \
            --s3-bucket ${{ secrets.DEPLOYMENT_BUCKET }} \
            --s3-key agentic-ai-${{ github.sha }}.zip \
            --region ${{ env.AWS_REGION }}
        continue-on-error: true
      
      - name: Update environment variables
        run: |
          aws lambda update-function-configuration \
            --function-name agentic-ai-function \
            --environment Variables={ENVIRONMENT=${{ env.ENVIRONMENT }},BEDROCK_MODEL_ID=${{ secrets.BEDROCK_MODEL_ID }}} \
            --region ${{ env.AWS_REGION }}
        continue-on-error: true
      
      - name: Health check
        run: |
          echo "Performing health checks..."
          sleep 10
          # Add your health check logic here
      
      - name: Deployment notification
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Deployment to ${{ env.ENVIRONMENT }} completed successfully'
            })
      
      - name: Deployment failure notification
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Deployment to ${{ env.ENVIRONMENT }} failed'
            })
