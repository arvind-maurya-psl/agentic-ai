version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-ai-app
    environment:
      ENVIRONMENT: staging
      DEBUG: "false"
      LOG_LEVEL: INFO
      AWS_REGION: us-east-1
      BEDROCK_MODEL_ID: anthropic.claude-3-5-sonnet-20241022-v2:0
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/var/log/app
      - ./data:/app/data
    depends_on:
      - redis
    networks:
      - agentic-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from agentic_ai.config import get_config; get_config()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: agentic-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - agentic-network
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass agentic_redis_pass_123
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:

networks:
  agentic-network:
    driver: bridge
